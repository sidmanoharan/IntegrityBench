    <rect x="32" y="0" width="32" height="64" fill="#d9a521"/>
  </g>
  <path d="M21.5 32.5 L29 40 L43 25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
