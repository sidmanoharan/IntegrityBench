<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- IntegrityBench mark: a balance. The model under test (ringed, at the pivot) weighs a misconduct
       task (purple) against its paired ethical control (gold); integrity means telling them apart. -->
  <style>
    .rule { fill: none; stroke: #979aa2; stroke-width: 2; stroke-linecap: round; }
    .ink { fill: #16171b; } .ring { fill: none; stroke: #16171b; stroke-width: 1.7; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f1f1f4; } .ring { stroke: #f1f1f4; } .rule { stroke: #8a8d96; } }
  </style>
  <path class="rule" d="M16 12 V27.5 M10.5 27.5 H21.5 M4.8 14.5 H27.2"/>
  <circle class="ring" cx="16" cy="7.6" r="4.8"/>
  <circle class="ink" cx="16" cy="7.6" r="2.5"/>
  <circle cx="5.2" cy="19.6" r="4.2" fill="#6a4c93"/>
  <circle cx="26.8" cy="19.6" r="4.2" fill="#d9a521"/>
</svg>
